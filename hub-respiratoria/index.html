<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1446">
<title>Hub Respiratoria · Ciclo 8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap">
<style>
  html,body{height:100%;margin:0}
  body{background:#1a1446;font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  #gate{position:fixed;inset:0;z-index:99;background:#1a1446;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Manrope,system-ui,sans-serif}
  #gate .g{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
  #gate .g h1{margin:0;font-size:34px;line-height:.95;letter-spacing:-.04em;font-weight:800}
  #gate .g p{margin:0;font-size:13px;font-weight:700;color:#c9c2e6;line-height:1.4}
  #gate input{width:100%;border:0;border-radius:18px;background:#fff;color:#1a1446;font:inherit;font-size:22px;font-weight:800;letter-spacing:.06em;padding:16px 18px;outline:none;text-transform:uppercase;box-sizing:border-box}
  #gate input.err{box-shadow:0 0 0 4px #e0288a}
  #gate input:focus-visible{box-shadow:0 0 0 4px #ffd23f}
  #gate button{font:inherit;border:0;text-align:center;border-radius:999px;min-height:54px;background:#e0288a;color:#fff;font-size:15px;font-weight:800;cursor:pointer}
  #gate button:disabled{opacity:.5}
  #gate .m{min-height:20px;font-size:12px;font-weight:800;color:#ffd23f}
  #gate .tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ffb3d6}
</style>
</head>
<body>
<div id="gate"><form class="g" id="f" autocomplete="off">
<span class="tag">Hub Carnot · Línea Respiratoria · demo ciclo 8</span>
<h1>Entra con tu código</h1>
<p>Tu clave de acceso es el código personal que te envió Polar (RESP-XXXX-XXXX).</p>
<input id="c" placeholder="RESP-XXXX-XXXX" inputmode="text" autocapitalize="characters" spellcheck="false" aria-label="Código de acceso" required>
<button type="submit" id="b">Entrar al hub</button>
<div class="m" id="m" role="status" aria-live="polite"></div>
</form></div>
<script>
const KEYS=[{"s": "YAHS3CRpg4UzlkRBnm2Jcw==", "i": "TLpITQ6GOH3j/W0E", "c": "mW4heFy11/xMCMZ0gftyf6ryayQ6tAHTetiBCwv5zCw7xU7sA1rRLaEXcULmwuxoKsv0lmt7QylbfiH0ZNqtPkd4OXDR+Bn/8xj1nuwoy6HYC+lFXYuTZq+aofX3MIczOMVfzPfzTJTfPQkj+93dIgi3QFgkztkRfA9l1O0M6y+N0A=="}, {"s": "q4uwtkWrbn71WMxCjL9YmQ==", "i": "dAZNiM95KYt5Pmf/", "c": "ptuIcDm+1cA7U6VZocLif0vgATE6PpO2waTE5exdyObDxRraa/RE77fpvgJq/LUglV6emsV8oqYz5i8VagaQb3IytBc6dxLpgpFEmFtH+ifrQvMor2nk2UaiyeZ9X4AL1EkqX5EDeDMPHQ0uP1oEl7n2Ib+mg+sySgwL3GyZs4kD0JE2wFG2lVMpqA=="}, {"s": "eaKIVV8rLIeoa1B5jedF3w==", "i": "+3fYdP0P3CXEoHme", "c": "0jKy+wvAqS6xLE5PoK6Tb39vPFvYMPJiznnDC6Uii9vqQuJL7oIRfV2O9tZRkD2hiEpEdJCY1S2GmlTALZtNHuXt8Jb20l15jvXhMhI4oBCKuC2VZFWiIL0gWfk2H5qW2CwIPsM8ImiZQbx854GiQGavbg/bTUnkMmYOHP5uwaAJSg=="}, {"s": "SdATxg9YMA+hbmxrWfOWhw==", "i": "iBdiSxMKA55Jr+y1", "c": "HSSfcDZqWzY84q/6gzfnv6+NapO4qfsQCGJwFqnDpcPQqP5/SE1CUPViaLPe+IdOQGdmjjC7uytLED9toDABDiQx+YK4eW2/Uk9W3e0w1RMWEFH2SjwLQ4aIwBf663Tt8H7ksgzPKAlIVh9NP6ejLhHDyHFJmuIK9/s="}], ITER=250000, IV='IDxJ2duN/f0BYgRC';
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unwrap(code){
  const raw=new TextEncoder().encode(code.replace(/[^A-Za-z0-9]/g,'').toUpperCase());
  const base=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);
  for(const k of KEYS){
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(k.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    try{ const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(k.i)},kek,ub(k.c)); return JSON.parse(new TextDecoder().decode(p)); }catch(_){}
  }
  return null;
}
async function open(code,quiet){
  const m=document.getElementById('m'), b=document.getElementById('b');
  b.disabled=true; m.textContent='Verificando…';
  const u=await unwrap(code);
  if(!u){ b.disabled=false; m.textContent=quiet?'':'Ese código no es válido. Revísalo e inténtalo de nuevo.'; if(!quiet) document.getElementById('c').classList.add('err'); try{ if(quiet) localStorage.removeItem('hr_code'); }catch(_){} return; }
  m.textContent='Abriendo el hub…';
  try{ localStorage.setItem('hr_code',code); }catch(_){}
  const r=await fetch('app.enc',{cache:'no-store'}); const ct=ub((await r.text()).trim());
  const key=await crypto.subtle.importKey('raw',ub(u.k),'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(IV)},key,ct));
  window.__HR_USER={n:u.n,r:u.r};
  document.open(); document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><script>window.__HR_USER='+JSON.stringify({n:u.n,r:u.r})+';window.__HR_K='+JSON.stringify(u.k)+'<\/script>'+html+'</body></html>'); document.close();
}
document.getElementById('f').addEventListener('submit',e=>{ e.preventDefault(); open(document.getElementById('c').value,false).catch(()=>{ document.getElementById('m').textContent='No se pudo abrir. Revisa tu conexión.'; document.getElementById('b').disabled=false; }); });
try{ const s=localStorage.getItem('hr_code'); if(s){ document.getElementById('c').value=s; open(s,true); } }catch(_){}
</script>
</body>
</html>
